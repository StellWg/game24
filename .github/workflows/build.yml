name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev automake libtool-bin

      - name: Add swap
        run: |
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=4096 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install buildozer
        run: pip install buildozer cython

      - name: Build APK (arm64 only)
        run: |
          sed -i 's/android.archs = arm64-v8a, armeabi-v7a/android.archs = arm64-v8a/' buildozer.spec
          # First run to download python-for-android
          buildozer -v android debug 2>&1 | tee build.log || true
          # Patch libffi recipe if it exists
          if [ -d "/home/runner/.buildozer/android/platform/python-for-android/pythonforandroid/recipes/libffi" ]; then
            cd /home/runner/.buildozer/android/platform/python-for-android/pythonforandroid/recipes/libffi
            sed -i 's/autogen.sh/autoreconf -fiv/' __init__.py
          fi
          # Second run to actually build
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game24-apk
          path: bin/*.apk