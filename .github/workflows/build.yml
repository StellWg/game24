name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev automake libtool-bin

      - name: Add swap
        run: |
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=4096 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install buildozer
        run: pip install buildozer cython

      - name: Build APK (arm64 only)
        run: |
          export ANDROIDNDK="/home/runner/.buildozer/android/platform/android-ndk-r25c"
          export ANDROID_NDK_HOME="/home/runner/.buildozer/android/platform/android-ndk-r25c"
          
          sed -i 's/android.archs = arm64-v8a, armeabi-v7a/android.archs = arm64-v8a/' buildozer.spec
          
          # First run: download python-for-android and recipes
          buildozer -v android debug 2>&1 | head -30 || true
          
          # Patch libffi recipe: upgrade to v3.4.6 (fixes configure.ac for modern autoconf)
          LIBFFI_RECIPE="/home/runner/.buildozer/android/platform/python-for-android/pythonforandroid/recipes/libffi/__init__.py"
          if [ -f "$LIBFFI_RECIPE" ]; then
            sed -i "s/version = '3.4.2'/version = '3.4.6'/" "$LIBFFI_RECIPE"
            sed -i "s|url = 'https://github.com/libffi/libffi/archive/v3.4.2.tar.gz'|url = 'https://github.com/libffi/libffi/archive/refs/tags/v3.4.6.tar.gz'|" "$LIBFFI_RECIPE"
            sed -i "/sha256/d" "$LIBFFI_RECIPE"
          fi
          
          # Remove r27c if it was downloaded, force r25c
          rm -rf /home/runner/.buildozer/android/platform/android-ndk-r27c
          
          # Second run: actual build with patched recipe and NDK 25c
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game24-apk
          path: bin/*.apk